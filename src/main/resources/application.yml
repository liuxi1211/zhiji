server:
  port: 8080

spring:
  application:
    name: zhiji
  profiles:
    # 未显式激活 profile 时默认 local：本地开发自动加载 config/application-local.properties（涉密配置只留本地、不入库）。
    # 显式激活别的 profile（测试 test、部署 prod 等）后本地文件不参与——测试不会被本机密钥污染，部署侧仍走环境变量。
    default: local
  threads:
    virtual:
      enabled: true
  ai:
    model:
      # 关闭 Spring AI 自动装配：provider 由 llm 模块按 zhiji.llm.providers 手动构建，
      # 避免启动即要求全局 api-key，且支持一进程多 provider。
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    url: jdbc:sqlite:${zhiji.data-dir:./data}/zhiji.db?journal_mode=WAL&foreign_keys=on&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 5
      pool-name: zhiji-sqlite-pool
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

zhiji:
  data-dir: ./data
  auth:
    # 开发占位值，仅够本机跑通；公网/共享环境在 config/application-local.properties 里换成随机串
    jwt-secret: dev-secret-please-change-in-production-0123456789abcdef
    token-ttl-days: 7
    captcha-ttl-minutes: 5
    captcha-enabled: true
  llm:
    timeout-seconds: 15
    # providers 仅作「首次启动种子」：空库首启时由 LlmChannelSection 原样种入 sys_config 的 llm.channel，
    # 之后运行时事实源是渠道库（管理台「LLM 管理」页可改，保存即生效）——改此处的 yml 不再影响已初始化的系统。
    # 首启种子读取时 api-key 仍从环境变量（ZHIJI_LLM_ARK_KEY 等）或本地 config/application-local.properties 解析，
    # 解析后的真实密钥随种子入库；此后密钥变更在 LLM 管理页渠道卡完成（脱敏显示，留空保持不变）。
    # protocol 不写默认 openai（OpenAI 兼容）；anthropic 为公司代理渠道（jlc，messages 协议，无 embedding）。
    # models：该渠道的 key 实际支持的模型清单（种子入库后作为路由校验与下拉事实源）；
    # default-model：该渠道的默认模型（种子路由与存量路由归一化的取值来源）。
    providers:
      ark:
        base-url: https://ark.cn-beijing.volces.com/api/coding/v3
        api-key: ${ZHIJI_LLM_ARK_KEY:}
        default-model: deepseek-v4.1-flash
        models:
          - doubao-seed-evolving
          - doubao-seed-2.1-pro
          - doubao-seed-2.1-lite
          - doubao-seed-2.0-mini
          - minimax-m3
          - glm-5.3
          - glm-5.3-flash
          - deepseek-v4.1-flash
          - deepseek-v4-flash
          - deepseek-v4-pro
          - kimi-k2.7-code
          - kimi-k2.8-preview
          - kimi-k3
      jlc:
        protocol: anthropic
        base-url: https://claude.jlcops.com/api
        api-key: ${ZHIJI_LLM_JLC_KEY:}
        default-model: deepseek-v4.1-flash
        models:
          - glm-5.3-flash
          - deepseek-v4.1-flash
          - doubao-seed-2.1-turbo
      deepseek:
        base-url: https://api.deepseek.com/v1
        api-key: ${ZHIJI_LLM_DEEPSEEK_KEY:}
        default-model: deepseek-chat
        models:
          - deepseek-chat
          - deepseek-reasoner
      glm:
        base-url: https://open.bigmodel.cn/api/paas/v4
        api-key: ${ZHIJI_LLM_GLM_KEY:}
        default-model: glm-4.7
        models:
          - glm-4.7
          - glm-4.7-air
          - glm-4.7-flash

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

logging:
  level:
    com.zhiji: DEBUG