zhiji:
  data-dir: ${java.io.tmpdir}
  source:
    # 素材图片落盘目录与数据目录同口径，测试期指向临时目录避免污染 ./data
    data-dir: ${java.io.tmpdir}
  auth:
    jwt-secret: test-secret-test-secret-test-secret-000
    captcha-enabled: false
  llm:
    timeout-seconds: 15
    providers:
      ark:
        base-url: https://ark.example.invalid/api/coding/v3
        api-key: test-key

spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

logging:
  level:
    com.zhiji: INFO
