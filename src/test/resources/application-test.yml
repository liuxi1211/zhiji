zhiji:
  data-dir: ${java.io.tmpdir}
  auth:
    jwt-secret: test-secret-test-secret-test-secret-000
    captcha-enabled: false
  llm:
    timeout-seconds: 15
    providers:
      jlc:
        protocol: anthropic
        base-url: https://jlc.example.invalid/api
        api-key: test-key
        default-model: deepseek-v4.1-flash
        models:
          - glm-5.3-flash
          - deepseek-v4.1-flash
          - doubao-seed-2.1-turbo
      ark:
        base-url: https://ark.example.invalid/api/coding/v3
        api-key: test-key

spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

logging:
  level:
    com.zhiji: INFO
